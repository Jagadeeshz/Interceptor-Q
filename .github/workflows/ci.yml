name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interceptor_admin
          POSTGRES_PASSWORD: interceptor_secret
          POSTGRES_DB: hermes_db
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DATABASE_URL: postgresql://interceptor_admin:interceptor_secret@localhost:5432/hermes_db
      HERMES_SECRET_KEY: testsecretkey
      API_KEY: testapikey
      # Add other required environment variables for testing
      MAUTIC_URL: http://mautic.test
      MAUTIC_USER: test
      MAUTIC_PASS: test
      LINKEDIN_ACCESS_TOKEN: testtoken
      WHATSAPP_TOKEN: testtoken
      WHATSAPP_PHONE_ID: 12345
      APOLLO_KEY: testapollo
      HUNTER_KEY: testhunter

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install frontend dependencies
          cd frontend/dashboard
          npm ci

      - name: Run backend tests
        run: |
          # Wait for PostgreSQL to be ready (though the service healthcheck should handle it)
          until pg_isready -h localhost -p 5432 -U interceptor_admin; do sleep 1; done
          # Run tests
          cd $GITHUB_WORKSPACE
          python -m pytest tests/ -v

      - name: Build Docker images
        run: |
          docker compose build
          # Optionally, you can push images to a registry here if you have secrets set up.

      - name: Run Docker compose up (quick smoke test)
        run: |
          docker compose up -d postgres redis
          # Wait for services to be healthy
          sleep 10
          docker compose ps
          docker compose down